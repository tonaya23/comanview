<!doctype html><html lang="es"><meta charset="utf-8"><title>B3b isolated viewport check</title>
<body style="margin:0;font-family:system-ui"><h1>B3b · Fixture aislado, sin Edge ni almacenamiento</h1>
<a href="?width=1366">1366 × 768</a> · <a href="?width=768">768 × 1024</a><p id="metrics" role="status">Cargando fixture…</p>
<iframe id="fixture" title="Admin Modificadores aislado" src="./modifiers-content.html" style="border:1px solid #bbb;display:block"></iframe>
<script type="module">
const width=new URLSearchParams(location.search).get('width')==='768'?768:1366,height=width===768?1024:768;
const frame=document.querySelector('iframe');frame.width=String(width);frame.height=String(height);
setInterval(()=>{const doc=frame.contentDocument,app=doc?.querySelector('.modifier-admin');if(!app)return;
const outside=[...app.querySelectorAll('button,input,fieldset')].filter(el=>el.getBoundingClientRect().width>0&& (el.getBoundingClientRect().right>width||el.getBoundingClientRect().left<0));
document.getElementById('metrics').textContent=`Viewport ${frame.contentWindow.innerWidth}×${frame.contentWindow.innerHeight} · Controles fuera del ancho: ${outside.length} · Documento: ${doc.documentElement.scrollWidth}px · Foco: ${doc.activeElement?.getAttribute('aria-label')??doc.activeElement?.textContent?.slice(0,70)??doc.activeElement?.tagName}`;
},300);
</script></body></html>
